<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancellations</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav>
    <div class="nav-title">Mobility Operations Intelligence Tool</div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/drivers">Drivers</a>
        <a href="/zones">Zones</a>
        <a href="/utilization">Utilization</a>
        <a href="/cancellations">Cancellations</a>
        <a href="/anomalies">Anomalies</a>
    </div>
</nav>

<div class="container">

    <h1>Cancellation Analysis</h1>

    <div class="card">

        <table>

            <thead>
                <tr>
                    <th>Cancellation Reason</th>
                    <th>Count</th>
                </tr>
            </thead>

            <tbody>

            {% for reason, count in reasons.items() %}

                <tr>
                    <td>{{ reason }}</td>
                    <td>{{ count }}</td>
                </tr>

            {% else %}

                <tr>
                    <td colspan="2">
                        No cancellation data available.
                    </td>
                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
